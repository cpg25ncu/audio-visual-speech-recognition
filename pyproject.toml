[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avsr"
version = "1.0.0"
description = "Noise-robust audio-visual isolated-word recognition: hand-built MFCC and lip-DCT front-ends, temporal CNNs, early and late fusion."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tongyao Liu" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "torch>=2.2",
]

[project.optional-dependencies]
landmarks = ["mediapipe>=0.10"]
dev = ["pytest>=7", "ruff>=0.4", "librosa>=0.10"]

[project.scripts]
avsr = "avsr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
